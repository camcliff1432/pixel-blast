<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Blast — prototype</title>
<style>
  html,body{margin:0;height:100%;background:#12141a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="src/core.js"></script>
<script src="src/levels.js"></script>
<script src="src/economy.js"></script>
<script>
(() => {
'use strict';
const { Game, PALETTE, RAINBOW, fullLines, stormLevel } = PBCore;
const LEVELS = PB_LEVELS;

const ECON = PB_ECON; // prices and rewards: src/economy.js

// ---------- canvas / scaling ----------
const W = 400, H = 780;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', resize);
resize();

const COL = Object.assign({ [RAINBOW]: '#f8fafc' }, PALETTE);
const RAINBOW_RING = ['R', 'Y', 'G', 'B'];
const LIGHT = new Set(['Y', 'L', 'A', 'K', 'O']); // colors that need dark text on top

// ---------- layout ----------
const PIC = 220, BELT = 24;
const PIC_X = (W - PIC) / 2, PIC_Y = 58 + BELT;
const QW = 52, QG = 8, QH = 42, QY = 344;
const QN = () => game.cfg.queueSize, QX = () => (W - (QN() * QW + (QN() - 1) * QG)) / 2;
const BN = 8, BC = 34, BX = (W - BN * BC) / 2, BY = 398;
const TRAY_Y = 680, TRAY_CELL = 20;

// ---------- state ----------
let mode = 'menu', game = null, levelIndex = 0, endless = false, testLevel = null;
let modeKind = 'classic';   // 'classic' | 'sand' | 'boss' (applies to album levels and endless)
let storm = false;          // sandstorm run
let duel = null;            // { kind, idx, seed, moves, secs } when playing a challenge link
let shareLink = '', bestStorm = 0, autoLaunch = false;
let fallOff = new Map(); // sand mode: 'x,y' -> remaining fall distance in cells (negative)
let effects = [], projs = [], toasts = [], drag = null, buttons = [], time = 0, winDelay = 0;
let coins = ECON.startCoins, streak = 0, album = new Set(), result = null;
try {
  const s = JSON.parse(localStorage.getItem('pixelblast-meta-v3') || 'null');
  if (s) { coins = s.coins; streak = s.streak; album = new Set(s.album); bestStorm = s.bestStorm || 0; autoLaunch = !!s.autoLaunch; }
} catch (_) {}
function saveMeta() {
  try { localStorage.setItem('pixelblast-meta-v3', JSON.stringify({ coins, streak, album: [...album], bestStorm, autoLaunch })); } catch (_) {}
}
const streakMult = s => Math.min(ECON.streakCap, 1 + ECON.streakStep * Math.max(0, s - 1));
const continueCost = () => game ? ECON.continueCosts[game.continues] : null; // undefined when out of continues
const N = () => game.N, PC = () => PIC / game.N;

function start(idx, isEndless, level, isTest) {
  testLevel = isTest ? level : null; // only a real play-test keeps the test flag
  endless = !!isEndless;
  levelIndex = idx;
  storm = false; duel = null; shareLink = '';
  const lv = level || (isEndless ? LEVELS[Math.floor(Math.random() * LEVELS.length)] : LEVELS[idx]);
  game = new Game(lv, { sand: modeKind === 'sand', boss: modeKind === 'boss', strictQueue: modeKind === 'strict', autoLaunch });
  effects = []; projs = []; toasts = []; drag = null; winDelay = 0; result = null; fallOff = new Map();
  mode = 'play';
}
function useBooster(kind) {
  if (mode !== 'play') return;
  const cost = ECON.booster[kind];
  if (coins < cost) { toast(`Need ${cost} coins`, '#fca5a5'); return; }
  if (kind === 'rainbow') {
    if (!game.addRainbow()) { toast('Queue is full', '#fca5a5'); return; }
    toast('Rainbow shooter: hits any color', '#f8fafc');
  } else {
    game.shuffleTray();
    toast('Tray shuffled', '#f8fafc');
  }
  coins -= cost;
  saveMeta();
}
function startStorm() {
  testLevel = null; endless = false;
  const seed = Math.floor(Math.random() * 1e9);
  game = new Game(stormLevel(seed, 12), { storm: true, seed, autoLaunch });
  storm = true; duel = null; shareLink = '';
  effects = []; projs = []; toasts = []; drag = null; winDelay = 0; result = null; fallOff = new Map();
  mode = 'play';
}
const KIND_LETTER = { classic: 'c', sand: 's', boss: 'b', strict: 't' }, LETTER_KIND = { c: 'classic', s: 'sand', b: 'boss', t: 'strict' };
function startDuel(d) {
  testLevel = null; endless = false; storm = false; shareLink = '';
  levelIndex = d.idx;
  game = new Game(LEVELS[d.idx], { seed: d.seed, sand: d.kind === 'sand', boss: d.kind === 'boss', strictQueue: d.kind === 'strict', autoLaunch });
  duel = d;
  effects = []; projs = []; toasts = []; drag = null; winDelay = 0; result = null; fallOff = new Map();
  mode = 'play';
}
function makeShareLink() {
  const kind = game.bossMode ? 'boss' : game.sandMode ? 'sand' : game.cfg.strictQueue ? 'strict' : 'classic';
  return location.href.split('#')[0] + `#duel-${KIND_LETTER[kind]}-${levelIndex}-${game.seed}-${game.moves}-${Math.round(game.time)}`;
}
function copyShare() {
  shareLink = makeShareLink();
  try {
    navigator.clipboard.writeText(shareLink).then(() => toast('Challenge link copied!', '#a7f3d0'), () => toast('Copy the link shown below', '#fde68a'));
  } catch (_) { toast('Copy the link shown below', '#fde68a'); }
}
function leaveRun() {
  if (mode === 'over' && !endless && !testLevel && !storm && !duel && streak > 0) { streak = 0; saveMeta(); }
}

// ---------- geometry ----------
function slotXY(i) {
  const n = N(), pc = PC(), lap = 4 * n;
  i = ((i % lap) + lap) % lap;
  const side = Math.floor(i / n), k = i % n, off = BELT / 2;
  if (side === 0) return [PIC_X + k * pc + pc / 2, PIC_Y - off];
  if (side === 1) return [PIC_X + PIC + off, PIC_Y + k * pc + pc / 2];
  if (side === 2) return [PIC_X + (n - 1 - k) * pc + pc / 2, PIC_Y + PIC + off];
  return [PIC_X - off, PIC_Y + (n - 1 - k) * pc + pc / 2];
}
function posXY(p) {
  const a = Math.floor(p), f = p - a;
  const [x1, y1] = slotXY(a), [x2, y2] = slotXY(a + 1);
  return [x1 + (x2 - x1) * f, y1 + (y2 - y1) * f];
}

// ---------- events from the core ----------
function handleEvents() {
  for (const e of game.drain()) {
    if (e.type === 'clear') {
      for (const c of e.cells) effects.push({ type: 'cell', x: BX + c.x * BC, y: BY + c.y * BC, color: c.color, t: 0 });
      if (e.n >= 2) toast(`Combo ×${e.n}! Ammo ×${game.cfg.comboMult}`, '#fde68a');
      if (e.mono) toast(`Single-color line! +${e.bonusShots} bonus shots`, '#a7f3d0');
      if (e.lost) toast(`Queue full — ${e.lost} shots lost`, '#fca5a5');
    } else if (e.type === 'fire') {
      const [sx, sy] = slotXY(e.slot), pc = PC();
      projs.push({ sx, sy, tx: PIC_X + e.x * pc + pc / 2, ty: PIC_Y + e.y * pc + pc / 2, px: e.x, py: e.y, color: e.color, pcolor: e.pcolor, t: 0 });
    } else if (e.type === 'fall') {
      for (const f of e.falls) {
        const prev = fallOff.get(`${f.x},${f.from}`) || 0;
        fallOff.delete(`${f.x},${f.from}`);
        fallOff.set(`${f.x},${f.to}`, prev + (f.from - f.to));
      }
    } else if (e.type === 'spent') {
      const [x, y] = posXY(e.pos);
      effects.push({ type: 'poof', x, y, color: e.color, t: 0 });
    } else if (e.type === 'returned') {
      toast('Unused shooter returned to queue', '#cbd5e1');
    } else if (e.type === 'lost') {
      toast(`Queue full — ${e.ammo} shots lost`, '#fca5a5');
    } else if (e.type === 'blocked') {
      toast(e.free === 0 ? 'Queue full! Launch a shooter before clearing lines' : `This clear needs ${e.need} queue slots — only ${e.free} free`, '#fca5a5');
    } else if (e.type === 'regrow') {
      const pc = PC();
      effects.push({ type: 'grow', x: PIC_X + e.x * pc, y: PIC_Y + e.y * pc, s: pc, color: e.color, t: 0 });
    } else if (e.type === 'spawn') {
      fallOff.set(`${e.x},${e.y}`, -(e.y + 1.5));
    } else if (e.type === 'surge') {
      toast(`Jammed! Sand surge: +${e.n} pixels`, '#fdba74');
    } else if (e.type === 'buried') {
      const secs = Math.round(game.time), earned = Math.floor(game.shotsFired / ECON.stormPixelsPerCoin);
      const isBest = secs > bestStorm;
      if (isBest) bestStorm = secs;
      coins += earned; saveMeta();
      result = { storm: true, secs, earned, isBest };
      mode = 'over'; drag = null;
    } else if (e.type === 'jam') {
      mode = 'over'; drag = null;
    } else if (e.type === 'won') {
      winDelay = 0.35;
    }
  }
}
function finishWin() {
  if (endless) {
    coins += ECON.endlessPerPicture;
    album.add(game.level.name);
    saveMeta();
    toast(`Picture cleared! +${ECON.endlessPerPicture} coins — next one`, '#fde68a');
    let n;
    do { n = Math.floor(Math.random() * LEVELS.length); } while (LEVELS.length > 1 && LEVELS[n].id === game.level.id);
    game.nextPicture(LEVELS[n]);
    return;
  }
  mode = 'win'; drag = null;
  if (duel) {
    const you = { moves: game.moves, secs: Math.round(game.time) };
    const won = you.moves < duel.moves || (you.moves === duel.moves && you.secs <= duel.secs);
    result = { duel: true, won, you };
    return;
  }
  if (testLevel) { result = { reward: 0, mult: 1, isNew: false, test: true }; return; }
  streak++;
  const mult = streakMult(streak);
  const reward = Math.round(ECON.winBase * mult);
  const isNew = !album.has(game.level.name);
  coins += reward;
  album.add(game.level.name);
  saveMeta();
  result = { reward, mult, isNew };
}

// ---------- update ----------
function updateFx(dt) {
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];
    p.t += dt / 0.14;
    if (p.t >= 1) {
      const pc = PC();
      effects.push({ type: 'pix', x: PIC_X + p.px * pc, y: PIC_Y + p.py * pc, s: pc, color: p.pcolor, t: 0 });
      projs.splice(i, 1);
    }
  }
  for (let i = effects.length - 1; i >= 0; i--) { effects[i].t += dt; if (effects[i].t > 0.4) effects.splice(i, 1); }
  for (let i = toasts.length - 1; i >= 0; i--) { toasts[i].t += dt; if (toasts[i].t > 1.8) toasts.splice(i, 1); }
  for (const [k, v] of fallOff) { const nv = v + dt * 16; if (nv >= 0) fallOff.delete(k); else fallOff.set(k, nv); }
}
function toast(text, color) {
  const dup = toasts.find(t => t.text === text);
  if (dup) { dup.t = Math.min(dup.t, 0.15); return; } // refresh instead of stacking
  toasts.push({ text, color: color || '#fff', t: 0 });
  if (toasts.length > 3) toasts.shift();
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function block(x, y, s, c, alpha = 1) {
  ctx.globalAlpha = alpha;
  if (s < 11) { // tiny pixels in big pictures: plain squares
    ctx.fillStyle = COL[c];
    ctx.fillRect(x + 0.4, y + 0.4, s - 0.8, s - 0.8);
    ctx.globalAlpha = 1;
    return;
  }
  rr(x + 1, y + 1, s - 2, s - 2, Math.min(6, s * 0.2));
  ctx.fillStyle = COL[c];
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  rr(x + 3, y + 3, s - 6, Math.max(2, (s - 6) * 0.32), Math.min(3, s * 0.1));
  ctx.fill();
  ctx.globalAlpha = 1;
}
function text(t, x, y, size, color, align = 'center', weight = '600') {
  ctx.font = `${weight} ${size}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}
function shooter(x, y, r, c, ammo) {
  if (c === RAINBOW) {
    RAINBOW_RING.forEach((k, i) => {
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.arc(x, y, r, i * Math.PI / 2 + time * 3, (i + 1) * Math.PI / 2 + time * 3);
      ctx.closePath(); ctx.fillStyle = COL[k]; ctx.fill();
    });
    ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fillStyle = 'rgba(15,17,22,.75)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
    text(String(ammo), x, y + 0.5, r * 0.95, '#fff', 'center', '800');
    return;
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = COL[c];
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.stroke();
  text(String(ammo), x, y + 0.5, r * (ammo > 99 ? 0.75 : 0.95), LIGHT.has(c) ? '#2a2310' : '#fff', 'center', '800');
}
function button(label, x, y, w, h, fn, primary) {
  rr(x, y, w, h, 12);
  ctx.fillStyle = primary ? '#f8fafc' : '#262a35';
  ctx.fill();
  text(label, x + w / 2, y + h / 2, 17, primary ? '#111827' : '#f1f5f9', 'center', '700');
  buttons.push({ x, y, w, h, fn });
}
function drawCoin(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#facc15'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2; ctx.stroke();
}
function drawBooster(kind, x, y) {
  const w = 54, h = 66, cost = ECON.booster[kind], can = coins >= cost;
  rr(x, y, w, h, 10); ctx.fillStyle = '#262a35'; ctx.fill();
  if (kind === 'rainbow') shooter(x + w / 2, y + 22, 12, RAINBOW, game.cfg.rainbowAmmo * game.ammoPerBlock);
  else {
    for (let i = 0; i < 3; i++) block(x + 9 + i * 12, y + 12 + (i % 2) * 6, 12, RAINBOW_RING[i]);
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x + w / 2, y + 22, 16, -0.4, 2.4); ctx.stroke();
  }
  text(kind === 'rainbow' ? 'Rainbow' : 'Shuffle', x + w / 2, y + 44, 10, '#cbd5e1', 'center', '700');
  drawCoin(x + 16, y + 57, 5);
  text(String(cost), x + 32, y + 57, 11, can ? '#fde68a' : '#64748b', 'center', '800');
  buttons.push({ x, y, w, h, fn: () => useBooster(kind) });
}
function drawThumb(level, x, y, s, revealed) {
  const rows = level.rows, n = rows.length, c = s / n;
  rr(x - 4, y - 4, s + 8, s + 8, 8); ctx.fillStyle = revealed ? '#1f2430' : '#1a1d25'; ctx.fill();
  for (let yy = 0; yy < n; yy++) for (let xx = 0; xx < n; xx++) {
    const ch = rows[yy][xx];
    if (ch === '.') continue;
    ctx.fillStyle = revealed ? COL[ch] : '#2c313d';
    ctx.fillRect(x + xx * c, y + yy * c, c - 0.5, c - 0.5);
  }
  if (!revealed) text('?', x + s / 2, y + s / 2, 20, '#64748b', 'center', '800');
}

// ---------- render ----------
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  buttons = [];
  ctx.fillStyle = '#12141a';
  ctx.fillRect(0, 0, W, H);
  if (mode === 'menu') { drawMenu(); return; }
  const n = N(), pc = PC();

  // HUD
  const prefix = storm ? '' : (duel ? 'Duel · ' : '') + (game.bossMode ? 'Boss · ' : game.sandMode ? 'Sand · ' : game.cfg.strictQueue ? 'Strict · ' : '');
  const title = storm ? 'Sandstorm' : prefix + (testLevel ? `Test · ${game.level.name}` : endless ? `Endless · ${game.level.name}` : game.level.name);
  text(title, 16, 22, 16, '#f1f5f9', 'left', '700');
  const t = Math.floor(game.time), clock = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  const sub = storm ? `${clock} survived · ${game.shotsFired} blasted · best ${Math.floor(bestStorm / 60)}:${String(bestStorm % 60).padStart(2, '0')}`
    : duel ? `${game.countPixels()} px left · ${game.moves} moves (beat ${duel.moves})`
    : `${game.countPixels()} px left`;
  text(sub, 16, 42, 11, storm ? '#fdba74' : duel ? '#a7f3d0' : '#94a3b8', 'left', '700');
  text(`${game.score}`, W - 52, 26, 17, '#fde68a', 'right', '800');
  rr(W - 42, 12, 30, 28, 8); ctx.fillStyle = '#262a35'; ctx.fill();
  text('☰', W - 27, 26, 16, '#e2e8f0');
  buttons.push({ x: W - 42, y: 12, w: 30, h: 28, fn: () => { leaveRun(); mode = 'menu'; drag = null; } });

  // belt track
  const bx = PIC_X - BELT, by = PIC_Y - BELT, bw = PIC + 2 * BELT;
  rr(bx, by, bw, bw, 14); ctx.fillStyle = '#232733'; ctx.fill();
  ctx.save();
  ctx.setLineDash([4, 8]);
  ctx.lineDashOffset = -time * game.speed * pc * 0.6;
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
  rr(bx + BELT / 2, by + BELT / 2, bw - BELT, bw - BELT, 8); ctx.stroke();
  ctx.restore();
  const [mx, my] = slotXY(0);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.moveTo(mx - 14, my - 5); ctx.lineTo(mx - 8, my); ctx.lineTo(mx - 14, my + 5); ctx.fill();

  // picture
  ctx.fillStyle = '#181b23';
  ctx.fillRect(PIC_X, PIC_Y, PIC, PIC);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const c = game.pic[y][x];
    if (!c) continue;
    const off = fallOff.size ? (fallOff.get(`${x},${y}`) || 0) : 0;
    block(PIC_X + x * pc, PIC_Y + (y + off) * pc, pc, c);
  }
  for (const p of projs) block(PIC_X + p.px * pc, PIC_Y + p.py * pc, pc, p.pcolor, 0.85);
  for (const e of effects) {
    const k = e.t / 0.4;
    if (e.type === 'pix') {
      const s = e.s * (1 + k * 0.8);
      block(e.x + e.s / 2 - s / 2, e.y + e.s / 2 - s / 2, s, e.color, 1 - k);
    } else if (e.type === 'grow') {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      const g = e.s * (0.6 + k * 1.6);
      ctx.strokeRect(e.x + e.s / 2 - g / 2, e.y + e.s / 2 - g / 2, g, g);
      ctx.globalAlpha = 1;
    } else if (e.type === 'poof') {
      ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(e.x, e.y, 10 + k * 14, 0, Math.PI * 2);
      ctx.strokeStyle = COL[e.color]; ctx.lineWidth = 3; ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  for (const p of projs) {
    const x = p.sx + (p.tx - p.sx) * p.t, y = p.sy + (p.ty - p.sy) * p.t;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fillStyle = COL[p.color]; ctx.fill();
  }
  for (const s of game.belt) { const [x, y] = posXY(s.pos); shooter(x, y, 10, s.color, s.ammo); }

  // side columns
  drawCoin(33, 104, 11);
  text(String(coins), 33, 128, 15, '#fde68a', 'center', '800');
  text('STREAK', 33, 168, 9, '#64748b', 'center', '800');
  text(`${streak}`, 33, 188, 18, streak > 0 ? '#fb923c' : '#475569', 'center', '800');
  text(`next ×${streakMult(streak + 1).toFixed(2).replace(/0$/, '')}`, 33, 208, 9, '#94a3b8', 'center', '700');
  drawBooster('rainbow', 340, 88);
  drawBooster('shuffle', 340, 168);

  // queue
  const lbl = game.cfg.autoLaunch ? `AUTO-LAUNCH ON  ·  BELT ${game.belt.length}/${game.beltCap}  ·  tap to switch off`
    : `TAP A SHOOTER TO LAUNCH  ·  BELT ${game.belt.length}/${game.beltCap}  ·  auto: off`;
  text(lbl, W / 2, 335, 10, game.cfg.autoLaunch ? '#a7f3d0' : '#64748b', 'center', '700');
  buttons.push({ x: 20, y: 326, w: W - 40, h: 18, fn: () => { autoLaunch = !autoLaunch; game.cfg.autoLaunch = autoLaunch; saveMeta(); toast(autoLaunch ? 'Auto-launch on: shooters go by themselves' : 'Auto-launch off: tap shooters to launch', '#e2e8f0'); } });
  for (let i = 0; i < QN(); i++) {
    const x = QX() + i * (QW + QG);
    rr(x, QY, QW, QH, 10);
    ctx.fillStyle = i < game.queue.length ? '#262a35' : '#1a1d25';
    ctx.fill();
    if (i < game.queue.length) shooter(x + QW / 2, QY + QH / 2, 15, game.queue[i].color, game.queue[i].ammo);
  }

  // board
  rr(BX - 6, BY - 6, BN * BC + 12, BN * BC + 12, 12);
  ctx.fillStyle = '#1a1d25'; ctx.fill();
  const preview = drag && mode === 'play' ? dragGeom() : null;
  let clearSet = null;
  const blocked = preview && preview.ok && game.cfg.strictQueue && game.wouldOverflowQueue(preview.p, preview.gx, preview.gy);
  if (preview && preview.ok) {
    const tmp = game.board.map(r => r.slice());
    for (const [x, y] of preview.p.sh) tmp[preview.gy + y][preview.gx + x] = preview.p.color;
    const { rows, cols } = fullLines(tmp);
    clearSet = new Set();
    for (const y of rows) for (let x = 0; x < BN; x++) clearSet.add(y * BN + x);
    for (const x of cols) for (let y = 0; y < BN; y++) clearSet.add(y * BN + x);
  }
  for (let y = 0; y < BN; y++) for (let x = 0; x < BN; x++) {
    const px = BX + x * BC, py = BY + y * BC;
    rr(px + 1, py + 1, BC - 2, BC - 2, 6);
    ctx.fillStyle = '#232733'; ctx.fill();
    if (game.board[y][x]) block(px, py, BC, game.board[y][x]);
    if (clearSet && clearSet.has(y * BN + x)) {
      rr(px + 1, py + 1, BC - 2, BC - 2, 6);
      ctx.fillStyle = blocked ? 'rgba(239,68,68,.45)' : 'rgba(255,255,255,.22)'; ctx.fill();
    }
  }
  if (preview && preview.ok) for (const [x, y] of preview.p.sh) block(BX + (preview.gx + x) * BC, BY + (preview.gy + y) * BC, BC, preview.p.color, 0.45);
  for (const e of effects) if (e.type === 'cell') {
    const k = e.t / 0.4, s = BC * (1 - k * 0.6);
    block(e.x + BC / 2 - s / 2, e.y + BC / 2 - s / 2, s, e.color, 1 - k);
  }

  // tray
  for (let i = 0; i < 3; i++) {
    const p = game.tray[i];
    if (!p || (drag && drag.i === i)) continue;
    const cx = (i + 0.5) * (W / 3), cy = TRAY_Y + 50;
    const ok = game.canPlaceAnywhere(p.sh);
    const ox = cx - p.w * TRAY_CELL / 2, oy = cy - p.h * TRAY_CELL / 2;
    for (const [x, y] of p.sh) block(ox + x * TRAY_CELL, oy + y * TRAY_CELL, TRAY_CELL, p.color, ok ? 1 : 0.3);
  }
  if (preview) for (const [x, y] of preview.p.sh) block(preview.gx0 + x * BC, preview.gy0 + y * BC, BC, preview.p.color, 0.95);

  if (mode === 'win' || mode === 'over') drawEnd();
  // toasts
  toasts.forEach((t, i) => {
    const a = t.t < 0.15 ? t.t / 0.15 : t.t > 1.4 ? Math.max(0, (1.8 - t.t) / 0.4) : 1;
    ctx.globalAlpha = a;
    const y = (mode === 'play' ? PIC_Y + PIC / 2 - 26 : 600) + i * 30 - t.t * 6;
    ctx.font = '700 14px system-ui,-apple-system,sans-serif';
    const w = ctx.measureText(t.text).width + 24;
    rr(W / 2 - w / 2, y - 13, w, 26, 13);
    ctx.fillStyle = 'rgba(10,12,16,.88)'; ctx.fill();
    text(t.text, W / 2, y, 14, t.color, 'center', '700');
    ctx.globalAlpha = 1;
  });


}

function drawMenu() {
  text('Pixel Blast', W / 2, 54, 34, '#f8fafc', 'center', '800');
  text('Pixel Flow × Block Blast — rough prototype', W / 2, 84, 13, '#94a3b8');
  const lines = [
    'Drag blocks onto the board. Fill rows or columns to clear them.',
    'Each cleared block becomes a shot of its color. Tap a shooter',
    'to send it around the belt: it hits the first pixel it sees,',
    'only if the colors match. Clear the picture; don\'t jam the board.',
  ];
  lines.forEach((l, i) => text(l, W / 2, 112 + i * 17, 11.5, '#cbd5e1', 'center', '500'));
  // mode chips
  const kinds = [['Classic', 'classic'], ['Sand', 'sand'], ['Boss', 'boss'], ['Strict', 'strict']];
  kinds.forEach(([label, v], i) => {
    const cw = 84, bx = (W - (4 * cw + 3 * 6)) / 2 + i * (cw + 6), by = 192, on = modeKind === v;
    rr(bx, by, cw, 30, 15); ctx.fillStyle = on ? '#fde68a' : '#262a35'; ctx.fill();
    text(label, bx + cw / 2, by + 15, 13, on ? '#111827' : '#cbd5e1', 'center', '800');
    buttons.push({ x: bx, y: by, w: cw, h: 30, fn: () => { modeKind = v; } });
  });
  const hint = { classic: 'Clear the picture before the board jams',
    sand: 'Sand: pixels fall · slower belt · no merging shooters',
    boss: 'Boss: the picture regrows pixels — outpace it',
    strict: 'Strict: 4-slot queue — if it\'s full, you can\'t clear lines' }[modeKind];
  text(hint, W / 2, 232, 11, modeKind === 'classic' ? '#94a3b8' : '#fde68a', 'center', '600');
  // setting: auto-launch
  {
    const pw = 200, px = (W - pw) / 2, py = 246;
    rr(px, py, pw, 26, 13); ctx.fillStyle = autoLaunch ? '#14532d' : '#262a35'; ctx.fill();
    text(`Auto-launch shooters: ${autoLaunch ? 'ON' : 'OFF'}`, W / 2, py + 13, 12, autoLaunch ? '#a7f3d0' : '#cbd5e1', 'center', '700');
    buttons.push({ x: px, y: py, w: pw, h: 26, fn: () => { autoLaunch = !autoLaunch; saveMeta(); } });
  }
  // album
  text(`ALBUM  ${album.size}/${LEVELS.length}  ·  tap a picture to play it`, W / 2, 292, 11, '#94a3b8', 'center', '800');
  const perRow = 4, s = 52, gap = 30;
  LEVELS.forEach((lv, i) => {
    const row = Math.floor(i / perRow), col = i % perRow;
    const inRow = Math.min(perRow, LEVELS.length - row * perRow);
    const x0 = (W - (inRow * s + (inRow - 1) * gap)) / 2;
    const x = x0 + col * (s + gap), y = 310 + row * 86;
    const has = album.has(lv.name);
    drawThumb(lv, x, y, s, has);
    text(`${i + 1}. ${lv.name}`, x + s / 2, y + s + 15, 10, has ? '#e2e8f0' : '#64748b', 'center', '700');
    buttons.push({ x: x - 4, y: y - 4, w: s + 8, h: s + 26, fn: () => start(i, false) });
  });
  // wallet + streak
  const wy = 310 + Math.ceil(LEVELS.length / perRow) * 86 - 4;
  rr(40, wy, W - 80, 50, 14); ctx.fillStyle = '#1a1d25'; ctx.fill();
  drawCoin(76, wy + 25, 11);
  text(`${coins} coins`, 94, wy + 25, 15, '#fde68a', 'left', '800');
  text(`Streak ${streak}`, W - 60, wy + 17, 14, streak > 0 ? '#fb923c' : '#94a3b8', 'right', '800');
  text(`next win ×${streakMult(streak + 1).toFixed(2).replace(/0$/, '')} coins`, W - 60, wy + 35, 10.5, '#94a3b8', 'right', '600');
  const bw = 300, bx = (W - bw) / 2;
  const nextIdx = Math.max(0, LEVELS.findIndex(l => !album.has(l.name)));
  button(`Play next · ${LEVELS[nextIdx].name}`, bx, wy + 62, bw, 50, () => start(nextIdx, false), true);
  const hw = (bw - 10) / 2;
  button('Endless', bx, wy + 122, hw, 46, () => start(0, true), false);
  button('Sandstorm', bx + hw + 10, wy + 122, hw, 46, () => startStorm(), false);
  if (bestStorm) text(`best ${Math.floor(bestStorm / 60)}:${String(bestStorm % 60).padStart(2, '0')}`, bx + hw + 10 + hw / 2, wy + 180, 10.5, '#fdba74', 'center', '700');
  text('Level editor →', W / 2, wy + 204, 13, '#94a3b8', 'center', '700');
  buttons.push({ x: W / 2 - 70, y: wy + 192, w: 140, h: 26, fn: () => { location.href = 'tools/editor.html'; } });
}

function drawLink(y) {
  if (!shareLink) return;
  ctx.font = '600 10px ui-monospace,Menlo,monospace';
  let t = shareLink;
  while (ctx.measureText(t).width > W - 40 && t.length > 20) t = '…' + t.slice(2);
  text(t, W / 2, y, 10, '#94a3b8', 'center', '600');
}
function drawEnd() {
  // The overlay covers the play screen, so drop every button under it: the hit test takes the
  // first rect that matches, and the play layer's strips used to swallow taps on these buttons.
  buttons = [];
  ctx.fillStyle = 'rgba(8,10,14,.84)';
  ctx.fillRect(0, 0, W, H);
  const win = mode === 'win';
  const bw = 240, x = (W - bw) / 2;
  // --- sandstorm over ---
  if (result && result.storm) {
    text('Buried!', W / 2, 190, 32, '#fdba74', 'center', '800');
    const m = Math.floor(result.secs / 60), sec = String(result.secs % 60).padStart(2, '0');
    text(`Survived ${m}:${sec} · ${game.shotsFired} pixels blasted`, W / 2, 236, 15, '#e2e8f0');
    if (result.isBest) text('New best time!', W / 2, 264, 14, '#a7f3d0', 'center', '700');
    drawCoin(W / 2 - 44, 296, 10);
    text(`+${result.earned} coins`, W / 2 - 28, 296, 17, '#fde68a', 'left', '800');
    button('Try again', x, 340, bw, 52, () => startStorm(), true);
    button('Menu', x, 404, bw, 52, () => { mode = 'menu'; }, false);
    return;
  }
  // --- duel results ---
  if (duel) {
    if (win) {
      text(result.won ? 'You win the duel!' : 'Duel lost', W / 2, 160, 30, result.won ? '#a7f3d0' : '#fca5a5', 'center', '800');
      drawThumb(game.level, W / 2 - 40, 192, 80, true);
      text(`You: ${result.you.moves} moves · ${result.you.secs}s`, W / 2, 304, 16, '#e2e8f0', 'center', '700');
      text(`Them: ${duel.moves} moves · ${duel.secs}s`, W / 2, 330, 16, '#94a3b8', 'center', '700');
      button('Send a challenge back', x, 370, bw, 52, () => copyShare(), true);
      drawLink(438);
      button('Menu', x, 456, bw, 52, () => { duel = null; mode = 'menu'; }, false);
    } else {
      text('Board jammed — duel lost', W / 2, 220, 26, '#fca5a5', 'center', '800');
      text(`Beat ${duel.moves} moves on ${game.level.name} · no continues in duels`, W / 2, 256, 13, '#94a3b8');
      button('Retry duel', x, 300, bw, 52, () => startDuel(duel), true);
      button('Menu', x, 364, bw, 52, () => { duel = null; mode = 'menu'; }, false);
    }
    return;
  }
  if (win) {
    text('Picture cleared!', W / 2, 130, 30, '#fde68a', 'center', '800');
    drawThumb(game.level, W / 2 - 42, 160, 84, true);
    if (result.test) {
      text(`Test run · ${game.moves} moves · ${Math.round(game.time)}s`, W / 2, 300, 15, '#e2e8f0');
      button('Play again', x, 420, bw, 52, () => start(0, false, testLevel, true), true);
      button('Menu', x, 484, bw, 52, () => { mode = 'menu'; }, false);
      return;
    }
    if (result.isNew) text('New picture added to your album!', W / 2, 266, 14, '#a7f3d0', 'center', '700');
    drawCoin(W / 2 - 62, 296, 11);
    text(`+${result.reward} coins`, W / 2 - 44, 296, 20, '#fde68a', 'left', '800');
    text(`Streak ${streak}  ·  ×${result.mult} multiplier`, W / 2, 326, 14, '#fb923c', 'center', '700');
    text(`${game.moves} moves · ${Math.round(game.time)}s · score ${game.score}`, W / 2, 350, 13, '#94a3b8');
    if (!endless) {
      button('Challenge a friend', x, 376, bw, 46, () => copyShare(), false);
      drawLink(434);
    }
    const next = (levelIndex + 1) % LEVELS.length;
    button(`Next · ${LEVELS[next].name}`, x, 452, bw, 52, () => start(next, false), true);
    button('Menu', x, 514, bw, 46, () => { mode = 'menu'; }, false);
  } else {
    text('Board jammed', W / 2, 200, 30, '#fca5a5', 'center', '800');
    text(`${game.countPixels()} pixels left  ·  Lines ${game.lines}${endless ? `  ·  Pictures ${game.picsCleared}` : ''}`, W / 2, 238, 15, '#e2e8f0');
    if (!endless && !testLevel && streak > 0) text(`Your ${streak}-win streak ends if you don't continue`, W / 2, 264, 13, '#fb923c', 'center', '700');
    const cost = continueCost();
    if (cost === undefined) {
      text('No continues left for this level', W / 2, 330, 14, '#64748b', 'center', '700');
    } else {
      const can = coins >= cost;
      rr(x, 300, bw, 56, 12); ctx.fillStyle = can ? '#fde68a' : '#3a3f4b'; ctx.fill();
      text('Shuffle & continue', x + bw / 2 - 24, 328, 16, can ? '#111827' : '#94a3b8', 'center', '800');
      drawCoin(x + bw - 46, 328, 9);
      text(String(cost), x + bw - 22, 328, 15, can ? '#111827' : '#94a3b8', 'center', '800');
      text(`Continue ${game.continues + 1} of ${ECON.continueCosts.length} · you have ${coins} coins`, W / 2, 372, 12, '#94a3b8');
      if (can) buttons.push({ x, y: 300, w: bw, h: 56, fn: () => {
        coins -= cost; saveMeta(); mode = 'play';
        game.continueAfterJam();
        toast('Tray shuffled — keep going!', '#fde68a');
      } });
    }
    // Retry replays exactly the level you just lost (a fresh run for endless)
    button('Retry', x, 396, bw, 52, () => { const t = !!testLevel, lv = game.level; leaveRun(); if (endless) start(0, true); else start(levelIndex, false, lv, t); }, false);
    button('Menu', x, 460, bw, 52, () => { leaveRun(); mode = 'menu'; }, false);
  }
}

// ---------- input ----------
function pt(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale];
}
function dragGeom() {
  const p = game.tray[drag.i];
  const gx0 = drag.x - p.w * BC / 2, gy0 = drag.y - p.h * BC - (drag.touch ? 34 : 6);
  const gx = Math.round((gx0 - BX) / BC), gy = Math.round((gy0 - BY) / BC);
  return { p, gx0, gy0, gx, gy, ok: game.fits(p.sh, gx, gy) };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = pt(e);
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  if (mode !== 'play') return;
  for (let i = 0; i < QN(); i++) {
    const qx = QX() + i * (QW + QG);
    if (x >= qx && x <= qx + QW && y >= QY && y <= QY + QH) {
      const r = game.launch(i);
      if (r === 'full') toast('Belt is full', '#fca5a5');
      else if (r === 'gap') toast('Wait for a gap on the belt', '#fca5a5');
      return;
    }
  }
  if (y >= TRAY_Y - 10) {
    const i = Math.min(2, Math.max(0, Math.floor(x / (W / 3))));
    if (game.tray[i]) {
      drag = { i, x, y, touch: e.pointerType !== 'mouse' };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const [x, y] = pt(e);
  drag.x = x; drag.y = y;
});
cv.addEventListener('pointerup', () => {
  if (!drag || mode !== 'play') { drag = null; return; }
  const g = dragGeom(), i = drag.i;
  drag = null;
  if (g.ok) game.placePiece(i, g.gx, g.gy);
});
cv.addEventListener('pointercancel', () => { drag = null; });

// ---------- loop ----------
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  time += dt;
  if (mode === 'play') {
    game.update(dt);
    handleEvents();
    if (winDelay > 0) { winDelay -= dt; if (winDelay <= 0) finishWin(); }
  }
  updateFx(dt);
  render();
  requestAnimationFrame(frame);
}

// Play-test a level sent from the editor (index.html#test)
const dm = location.hash.match(/^#duel-([csbt])-(\d+)-(\d+)-(\d+)-(\d+)$/);
if (dm && LEVELS[+dm[2]]) {
  startDuel({ kind: LETTER_KIND[dm[1]], idx: +dm[2], seed: +dm[3], moves: +dm[4], secs: +dm[5] });
  toast(`Duel! Beat ${+dm[4]} moves on ${LEVELS[+dm[2]].name}`, '#a7f3d0');
} else if (location.hash === '#test') {
  try {
    const lv = JSON.parse(localStorage.getItem('pb-test-level') || 'null');
    if (lv && lv.rows) start(0, false, lv, true);
  } catch (_) {}
}
requestAnimationFrame(frame);

// test hooks
window.__pb = {
  start: (i, e) => start(i, e),
  launch: i => game.launch(i),
  clearPic: () => { for (const r of game.pic) r.fill(null); },
  share: () => shareLink,
  stormState: () => game && ({ status: game.status, t: Math.round(game.time), shots: game.shotsFired, boss: game.bossMode, sand: game.sandMode, seed: game.seed, moves: game.moves }),
  state: () => ({ level: game && game.level.id, levelIndex, mode, coins, streak, album: [...album], score: game && game.score, continues: game && game.continues, queue: game && game.queue.length, pixels: game && game.countPixels(), N: game && game.N }),
  autoPlace: () => {
    for (let i = 0; i < 3; i++) {
      const p = game.tray[i];
      if (!p) continue;
      for (let y = 0; y < BN; y++) for (let x = 0; x < BN; x++) if (game.fits(p.sh, x, y)) { game.placePiece(i, x, y); handleEvents(); return true; }
    }
    return false;
  },
};
})();
